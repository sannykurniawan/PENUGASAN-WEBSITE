<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulir</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <form action="">
        <fieldset>
            <legend>Biodata</legend>
            <p>Nama : <input type="text" placeholder="name" size="20" required></p>
            <p>No Induk Mahasiswa <input type="text" placeholder="NIM" size="20" required></p> 
            <p>Alamat :<textarea placeholder="" cols="30" rows="10"></textarea></p>
            <p>Tanggal Lahir: <input type="date" ></p>
            <p>Jenis Kelamin: <input type="radio"checked name="laki" value="laki"><label for="radio1">Laki-laki</label>
                              <input type="radio" name="perempuan" value="perempuan"><label for="radio2">Perempuan</label> </p>
            <p>Upload Foto : <input type="file" size="20"></p>
            <p>URL Website : <input type="text" placeholder="masukkan Link website anda" size="20"></p>
            <p>Perguruan Tinggi : <input type="text" placeholder="Nama Universitas" size="20"></p>
     
        </fieldset>

    </form>

    <form action="">
        <fieldset>
            <legend>Info Akun</legend>
            <p>Email : <input type="email" size="20" placeholder="Email anda" required></p>
            <p>Username : <input type="name" size="20" placeholder="Username" required></p>
            <p>Password : <input type="password" name="password" required></p>
            <p>Ulangi Password : <input type="password" name="password" required></p>
        </fieldset>
    </form>

    <form action="">
        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <input type="checkbox" name="HTML" id="HTML"><label for="HTML">HTML</label>
            <input type="checkbox" name="CSS" id="CSS"><label for="CSS">CSS</label>
            <input type="checkbox" name="Javascript" id="Javascript"><label for="Javascript">Javascript</label>
            <input type="checkbox" name="PHP" id="PHP"><label for="PHP">PHP</label>
            <input type="checkbox" name="MySQL" id="MySQL"><label for="MySQL">MySQL</label>
            <input type="checkbox" name="Laravel" id="Laravel"><label for="Laravel">Laravel</label>
            <input type="checkbox" name="React Native" id="React Native"><label for="React Native">React Native</label>
        </fieldset>
    </form>
<input type="reset" value="Reset">
<input type="submit" value="Simpan">
<input type="button" name="button" value="Button">

</body>
</html>
